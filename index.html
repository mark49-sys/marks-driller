  <script>
    if ('serviceWorker' in navigator && (window.isSecureContext || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      function syncServiceWorker() {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].update().catch(function() {});
          }
        }).catch(function() {});

        navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function(reg) {
          reg.update().catch(function() {});
        }).catch(function(err) {
          console.warn('[SW Registration Notice]', err);
        });
      }

      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        syncServiceWorker();
      } else {
        window.addEventListener('DOMContentLoaded', syncServiceWorker);
        window.addEventListener('load', syncServiceWorker);
      }
    }
  </script>
